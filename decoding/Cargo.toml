[package]
name = "hex-conservative-decoding"
version = "1.0.0"
authors = ["Martin Habovštiak <martin.habovstiak@gmail.com>", "Andrew Poelstra <apoelstra@wpsoftware.net>"]
license = "CC0-1.0"
repository = "https://github.com/rust-bitcoin/hex-conservative"
description = "Hex decoding for the hex-conservative crate, usable by its lower MSRV release lines."
categories = ["encoding", "no-std"]
keywords = ["encoding", "hex", "hexadecimal"]
readme = "README.md"
edition = "2021"
rust-version = "1.60.0"
exclude = [".cargo"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
newer-rust-version = ["dep:if_rust_version"]

[dependencies]
if_rust_version = { version = "1.0.0", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.rbmt.api]
enabled = true
features = [["alloc"]]

[package.metadata.rbmt.test]
exact_features = [
    ["alloc", "newer-rust-version"],
    ["std", "newer-rust-version"],
]

[lints]
workspace = true
